name: profile-service-cpp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: profile_service
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: profile_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://profile_user:profile_pass@postgres:5432/profile_service
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: test
      MINIO_SECRET_KEY: test
    ports:
      - "8082:8082"

volumes:
  postgres_data:
