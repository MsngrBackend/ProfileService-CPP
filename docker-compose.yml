name: profile-service-cpp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: profile_service
      POSTGRES_USER: profile_user
      POSTGRES_PASSWORD: profile_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HTTP version (default)
  app-http:
    build:
      context: .
      dockerfile: Dockerfile.http
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://profile_user:profile_pass@postgres:5432/profile_service
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8082:8082"
    profiles:
      - http
      - default

  # HTTPS version (with automatic certificate generation)
  app-https:
    build:
      context: .
      dockerfile: Dockerfile.https
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://profile_user:profile_pass@postgres:5432/profile_service
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8443:8443"
    profiles:
      - https

  # Both HTTP and HTTPS
  app-both:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_HTTPS: "true"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://profile_user:profile_pass@postgres:5432/profile_service
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8082:8082"
      - "8443:8443"
    profiles:
      - both

volumes:
  postgres_data:
  minio_data: